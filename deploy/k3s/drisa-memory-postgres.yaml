apiVersion: v1
kind: Service
metadata:
  name: drisa-memory-postgres
  namespace: iku
  labels:
    app.kubernetes.io/name: drisa-memory-postgres
    app.kubernetes.io/part-of: iku
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: drisa-memory-postgres-v5
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: drisa-memory-postgres-v5
  namespace: iku
  labels:
    app.kubernetes.io/name: drisa-memory-postgres-v5
    app.kubernetes.io/part-of: iku
spec:
  serviceName: drisa-memory-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drisa-memory-postgres-v5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drisa-memory-postgres-v5
        app.kubernetes.io/part-of: iku
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: vps-4e5174e4
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: credentials
          secret:
            secretName: drisa-memory-postgres
            defaultMode: 0440
      initContainers:
        - name: initialize-data-directory
          image: postgres:18.6-alpine3.24@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                initdb -D "$PGDATA" --username=drisa_memory --pwfile=/run/secrets/postgres/password --auth-local=trust --auth-host=scram-sha-256
                printf "\nlisten_addresses = '*'\nio_method = 'sync'\n" >> "$PGDATA/postgresql.conf"
                printf "host all all 10.42.0.1/32 trust\nhost all all 0.0.0.0/0 scram-sha-256\nhost all all ::/0 scram-sha-256\n" >> "$PGDATA/pg_hba.conf"
              fi
              mkdir -p "$PGDATA/backups"
              chmod 0700 "$PGDATA/backups"
          env:
            - name: PGDATA
              value: /var/lib/postgresql/drisa-memory
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: credentials
              mountPath: /run/secrets/postgres
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: logical-backup
          image: postgres:18.6-alpine3.24@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              backup_dir=/var/lib/postgresql/drisa-memory/backups
              while true; do
                tmp="$backup_dir/drisa-memory.dump.tmp"
                if pg_dump --host=127.0.0.1 --username=drisa_memory --dbname=drisa_memory --format=custom --no-owner --file="$tmp"; then
                  chmod 0600 "$tmp"
                  mv -f "$tmp" "$backup_dir/drisa-memory.dump"
                  echo "Drisa PostgreSQL logical dump refreshed"
                  sleep 3600
                else
                  rm -f "$tmp"
                  echo "Drisa PostgreSQL logical dump failed" >&2
                  sleep 30
                fi
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: drisa-memory-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: credentials
              mountPath: /run/secrets/postgres
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: postgres
          image: postgres:18.6-alpine3.24@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/drisa-memory
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: credentials
              mountPath: /run/secrets/postgres
              readOnly: true
          command: ["postgres"]
          args: ["-D", "/var/lib/postgresql/drisa-memory"]
          lifecycle:
            preStop:
              exec:
                command: ["pg_ctl", "-D", "/var/lib/postgresql/drisa-memory", "-m", "fast", "-w", "-t", "40", "stop"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "drisa_memory", "-d", "drisa_memory"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "drisa_memory", "-d", "drisa_memory"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "drisa_memory", "-d", "drisa_memory"]
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: drisa-memory-postgres-v5
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drisa-memory-postgres
  namespace: iku
  labels:
    app.kubernetes.io/part-of: iku
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: drisa-memory-postgres-v5
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 5432
