apiVersion: v1
kind: ConfigMap
metadata:
  name: iku-public-site-nginx
  namespace: iku
  labels:
    app.kubernetes.io/name: iku-public-site
    app.kubernetes.io/part-of: iku
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { return 204; }
        location / { return 404; }
    }

    server {
        listen 80;
        server_name iknowu.org;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        location / { try_files $uri $uri/ /index.html; }
        location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
            try_files $uri =404;
        }
    }

    server {
        listen 80;
        server_name app.iknowu.org;
        location / {
            proxy_pass http://iku-portal.iku.svc.cluster.local:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iku-public-site
  namespace: iku
  labels:
    app.kubernetes.io/name: iku-public-site
    app.kubernetes.io/part-of: iku
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iku-public-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iku-public-site
        app.kubernetes.io/part-of: iku
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: vps-4e5174e4
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/nginx/nginx-unprivileged:1.30.6-alpine-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /run/cloudflared/token
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tunnel-token
              mountPath: /run/cloudflared
              readOnly: true
            - name: cloudflared-tmp
              mountPath: /tmp
      volumes:
        - name: site-content
          configMap:
            name: iku-public-site
            defaultMode: 0444
        - name: nginx-config
          configMap:
            name: iku-public-site-nginx
            defaultMode: 0444
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 8Mi
        - name: cloudflared-tmp
          emptyDir:
            sizeLimit: 8Mi
        - name: tunnel-token
          secret:
            secretName: iku-public-site-tunnel-token
            defaultMode: 0440
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: iku-public-site
  namespace: iku
  labels:
    app.kubernetes.io/name: iku-public-site
    app.kubernetes.io/part-of: iku
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iku-public-site
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
