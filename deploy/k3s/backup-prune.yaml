apiVersion: batch/v1
kind: CronJob
metadata:
  name: iku-backup-prune
  namespace: iku-backup
  labels:
    app.kubernetes.io/name: iku-backup-prune
    app.kubernetes.io/part-of: iku
spec:
  schedule: "17 9 * * 0"
  timeZone: Europe/Paris
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: iku-backup-prune
        app.kubernetes.io/part-of: iku
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iku-backup-prune
            app.kubernetes.io/part-of: iku
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: homelab
          tolerations:
            - key: homelab.role
              operator: Equal
              value: fallback
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command: ["restic"]
              args:
                - forget
                - --host
                - vps-4e5174e4
                - --tag
                - iku
                - --keep-daily
                - "7"
                - --keep-weekly
                - "4"
                - --keep-monthly
                - "6"
                - --prune
              env:
                - name: RESTIC_REPOSITORY
                  value: /repository/iku-backup
                - name: RESTIC_PASSWORD_FILE
                  value: /run/secrets/backup/restic-password
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: Europe/Paris
              volumeMounts:
                - name: repository
                  mountPath: /repository
                - name: credentials
                  mountPath: /run/secrets/backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: repository
              persistentVolumeClaim:
                claimName: iku-backup-repo
            - name: credentials
              secret:
                secretName: iku-backup-credentials
                defaultMode: 0440
                items:
                  - key: restic-password
                    path: restic-password
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iku-backup-prune
  namespace: iku-backup
  labels:
    app.kubernetes.io/part-of: iku
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iku-backup-prune
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
