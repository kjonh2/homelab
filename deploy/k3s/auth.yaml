apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iku-auth-data
  namespace: iku
  labels:
    app.kubernetes.io/part-of: iku
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iku-auth
  namespace: iku
  labels:
    app.kubernetes.io/name: iku-auth
    app.kubernetes.io/part-of: iku
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iku-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iku-auth
        app.kubernetes.io/part-of: iku
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: vps-4e5174e4
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: iku-auth:0.1.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: IKU_AUTH_DB_PATH
              value: /var/lib/iku-auth/auth.sqlite3
            - name: IKU_AUTH_BOOTSTRAP_TOKEN_FILE
              value: /run/secrets/iku-auth/bootstrap-token
            - name: IKU_AUTH_TOTP_KEY_FILE
              value: /run/secrets/iku-auth/totp-key
            - name: IKU_AUTH_ALLOWED_ORIGINS
              value: https://vps-4e5174e4.tail2931da.ts.net
            - name: IKU_FIREBASE_PROJECT_ID
              value: local-44782
          volumeMounts:
            - name: data
              mountPath: /var/lib/iku-auth
            - name: secrets
              mountPath: /run/secrets/iku-auth
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iku-auth-data
        - name: secrets
          secret:
            secretName: iku-auth-secrets
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: iku-auth
  namespace: iku
  labels:
    app.kubernetes.io/part-of: iku
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iku-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
