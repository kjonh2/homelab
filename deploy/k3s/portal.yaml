apiVersion: apps/v1
kind: Deployment
metadata:
  name: iku-portal
  namespace: iku
  labels:
    app.kubernetes.io/name: iku-portal
    app.kubernetes.io/part-of: iku
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iku-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iku-portal
        app.kubernetes.io/part-of: iku
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: iku-portal:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iku-portal
  namespace: iku
  labels:
    app.kubernetes.io/part-of: iku
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iku-portal
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
